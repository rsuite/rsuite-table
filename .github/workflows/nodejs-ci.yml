# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
jobs:
  test:
    name: 'Test'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [ChromeCi, Firefox]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: ~/.npm # npm cache files are stored in `~/.npm` on Linux/macOS
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-
            ${{ runner.OS }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Chrome trace artifact validator
        if: matrix.browser == 'ChromeCi'
        run: node --test test/checkChromeTraceArtifacts.test.js
      - name: Verify Chrome trace collection and failure cleanup
        if: matrix.browser == 'ChromeCi'
        run: xvfb-run --auto-servernum npm run test:chrome-trace
      - name: Run headless tests
        run: xvfb-run --auto-servernum npm test
        env:
          CI: true
          BROWSER: ${{ matrix.browser }}
          CHROME_TRACE: ${{ matrix.browser == 'ChromeCi' && '1' || '0' }}
      - name: Verify Chrome native frame artifacts
        if: always() && matrix.browser == 'ChromeCi'
        run: node test/checkChromeTraceArtifacts.js
      - name: Preserve Chrome native frame diagnostics
        if: always() && matrix.browser == 'ChromeCi'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-native-frame-trace
          path: coverage/chrome-trace/
          if-no-files-found: warn
          retention-days: 7
